const KEY='motorHisabBook_v1';
let db=load();
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.accounts)return x}catch(e){}return {accounts:{pintu:{name:'Pintu Patel',types:defaults.pintu,entries:[]},jay:{name:'Jay Patel',types:defaults.jay,entries:[]}}};}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));}
function t(k){return (translations[state.lang]||translations.en)[k]||translations.en[k]||k}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let el=$('#toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1900)}
function allEntries(){return Object.entries(db.accounts).flatMap(([id,a])=>a.entries.map(e=>({...e,accountId:id,accountName:a.name})))}
function sum(es){return es.reduce((s,e)=>s+Number(e.qty)*Number(e.rate),0)}
function setTab(tab){state.tab=tab;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function accountName(id){return db.accounts[id]?.name||id}
function monthEntries(id,month){let prefix=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`;return (id?db.accounts[id].entries:allEntries()).filter(e=>e.date.startsWith(prefix))}
function header(title,back=true){return `<div class="toolbar">${back?`<button class="back" onclick="goHome()">‹ ${t('back')}</button>`:'<span></span>'}<b>${title}</b><span></span></div>`}
function goHome(){state.account=null;setTab('home')}
function render(){if(state.tab==='home')home();else if(state.tab==='calendar')calendar();else if(state.tab==='records')records();else if(state.tab==='reports')reports();else settings();$('#topTitle').textContent=state.account?accountName(state.account):'Your work, clearly organised.'}
function home(){state.account=null;let cards=Object.entries(db.accounts).map(([id,a])=>{let es=monthEntries(id,state.month);return `<div class="card account"><div><div class="account-head"><div class="account-name">${esc(a.name)}</div><span class="tag">${es.length} ${t('entries')}</span></div><div class="amount">${money(sum(es))}</div><div class="small">${t('monthTotal')} · ${state.month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div></div><button class="btn full" onclick="openAccount('${id}')">${t('open')} →</button></div>`}).join('');
$('#view').innerHTML=`<div class="section-title">${t('choose')}</div><div class="grid">${cards}</div><div class="section-title" style="margin-top:22px">${t('combined')}</div><div class="card"><div class="small">${t('monthTotal')}</div><div class="amount">${money(sum(monthEntries(null,state.month)))}</div><div class="small">${t('pintu')} + ${t('jay')}</div></div><div class="section-title" style="margin-top:22px">${t('work')}</div><div class="grid"><button class="tile" onclick="setTab('calendar')"><span class="tileicon">▦</span><span><b>${t('calendar')}</b><small>${t('dailySheet')}</small></span></button><button class="tile" onclick="setTab('records')"><span class="tileicon">▤</span><span><b>${t('records')}</b><small>${t('fullHisab')}</small></span></button><button class="tile" onclick="setTab('reports')"><span class="tileicon">▥</span><span><b>${t('reports')}</b><small>${t('monthly')}</small></span></button><button class="tile" onclick="setTab('settings')"><span class="tileicon">⚙</span><span><b>${t('settings')}</b><small>${t('motorSettings')}</small></span></button></div>`}
function openAccount(id){state.account=id;state.tab='calendar';state.month=new Date(today.getFullYear(),today.getMonth(),1);setTab('calendar')}
function calendar(){if(!state.account){$('#view').innerHTML=`<div class="section-title">${t('selectAccount')}</div><div class="grid">${Object.entries(db.accounts).map(([id,a])=>`<button class="tile" onclick="openAccount('${id}')"><span class="tileicon">⚙</span><span><b>${esc(a.name)}</b><small>${t('open')}</small></span></button>`).join('')}</div>`;return}
let m=state.month,year=m.getFullYear(),mon=m.getMonth(),first=new Date(year,mon,1).getDay(),days=new Date(year,mon+1,0).getDate(),es=monthEntries(state.account,m);
let cells=Array(first).fill('<button class="day" disabled></button>').join('');
for(let d=1;d<=days;d++){let dt=`${year}-${String(mon+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dayEs=es.filter(e=>e.date===dt),amt=sum(dayEs);cells+=`<button class="day ${dayEs.length?'has':''} ${dt===iso(today)?'today':''}" onclick="openDay('${dt}')"><div class="daynum">${d}</div>${dayEs.length?`<div class="dayamt">${money(amt)}</div><div class="dot"></div>`:''}</button>`}
$('#view').innerHTML=`${header(esc(accountName(state.account)))}<div class="monthbar"><button onclick="shiftMonth(-1)">‹</button><b>${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">›</button></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dayname">${x}</div>`).join('')}${cells}</div><div class="summaryrow"><div class="mini"><span class="small">${t('monthTotal')}</span><strong>${money(sum(es))}</strong></div><div class="mini"><span class="small">${t('workCount')}</span><strong>${es.length}</strong></div></div><button class="btn full" onclick="openDay('${iso(today)}')">＋ ${t('addEntry')} · ${t('date')} ${today.getDate()}</button>`;
}
function shiftMonth(n){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+n,1);calendar()}
function openDay(date){state.date=date;dailySheet()}
function dailySheet(){let a=db.accounts[state.account],es=a.entries.filter(e=>e.date===state.date).sort((x,y)=>x.created-y.created);$('#view').innerHTML=`${header(`${esc(a.name)} · ${state.date}`)}<div class="section-title">${t('dailySheet')}</div>${es.length?es.map(e=>entryCard(e)).join(''):`<div class="empty"><div class="big">📒</div><b>${t('noEntries')}</b><p>${t('emptyHint')}</p></div>`}<div class="totalbox"><span><b>${t('dailyTotal')}</b><div class="small">${es.length} ${t('entries')}</div></span><strong>${money(sum(es))}</strong></div><button class="btn full" style="margin-top:14px" onclick="entryForm()">＋ ${t('addEntry')}</button>`}
function entryCard(e){return `<div class="entry"><div class="entrytop"><div><div class="entryname">${esc(e.type)}</div><div class="entrymath">${e.qty} × ${money(e.rate)}</div></div><div class="entryamt">${money(e.qty*e.rate)}</div></div><div class="entrytop" style="margin-top:10px"><span class="small">${esc(e.note||'')}</span><div class="entryactions"><button class="iconbtn" onclick="entryForm('${e.id}')">✎</button><button class="iconbtn" onclick="deleteEntry('${e.id}')">⌫</button></div></div></div>`}
function entryForm(id=null){let a=db.accounts[state.account],old=id?a.entries.find(x=>x.id===id):null;state.editId=id;let options=a.types.map(x=>`<option ${old?.type===x?'selected':''}>${esc(x)}</option>`).join('');$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h3>${old?t('edit'):t('addEntry')}</h3><div class="field"><label>${t('date')}</label><input id="fdate" type="date" value="${old?.date||state.date}"></div><div class="field"><label>${t('motor')}</label><select id="ftype">${options}</select></div><div class="field"><label>${t('quantity')}</label><input id="fqty" type="number" min="0.01" step="any" value="${old?.qty||1}" oninput="calcAmount()"></div><div class="field"><label>${t('rate')}</label><input id="frate" type="number" min="0" step="any" value="${old?.rate||''}" oninput="calcAmount()" placeholder="e.g. 70"></div><div class="totalbox"><span>${t('amount')}</span><strong id="famount">₹0</strong></div><div class="field"><label>Note (optional)</label><input id="fnote" value="${esc(old?.note||'')}" placeholder="Optional detail"></div><div class="notice">${t('rateHint')}</div><div class="btnrow" style="margin-top:15px"><button class="btn" style="flex:1" onclick="saveEntry()">${t('save')}</button><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button></div></div></div>`;calcAmount()}
function calcAmount(){let q=Number($('#fqty')?.value||0),r=Number($('#frate')?.value||0);if($('#famount'))$('#famount').textContent=money(q*r)}
function closeModal(){$('#modalroot').innerHTML='';state.editId=null}
function saveEntry(){let a=db.accounts[state.account],date=$('#fdate').value,type=$('#ftype').value,qty=Number($('#fqty').value),rate=Number($('#frate').value);if(!date||!type||!(qty>0)||rate<0||!Number.isFinite(rate)){toast('Please check date, quantity and rate');return}let note=$('#fnote').value.trim();if(state.editId){let e=a.entries.find(x=>x.id===state.editId);Object.assign(e,{date,type,qty,rate,note})}else a.entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),date,type,qty,rate,note,created:Date.now()});persist();state.date=date;closeModal();dailySheet();toast(t('saved'))}
function deleteEntry(id){if(!confirm(t('confirmDelete')))return;let a=db.accounts[state.account];a.entries=a.entries.filter(e=>e.id!==id);persist();dailySheet();toast(t('deleted'))}
function records(){let account=state.account||'all';let es=account==='all'?allEntries():db.accounts[account].entries.map(e=>({...e,accountName:accountName(account)}));es.sort((a,b)=>b.date.localeCompare(a.date));let q=window.recordSearch||'';if(q)es=es.filter(e=>(e.type+' '+e.date+' '+e.accountName).toLowerCase().includes(q.toLowerCase()));let groups={};es.forEach(e=>(groups[e.date]??=[]).push(e));$('#view').innerHTML=`<div class="section-title">${t('fullHisab')}</div><div class="field"><label>${t('account')}</label><select onchange="state.account=this.value==='all'?null:this.value;records()"><option value="all" ${!state.account?'selected':''}>${t('allAccounts')}</option><option value="pintu" ${state.account==='pintu'?'selected':''}>${t('pintu')}</option><option value="jay" ${state.account==='jay'?'selected':''}>${t('jay')}</option></select></div><div class="field"><input placeholder="${t('search')}" value="${esc(q)}" oninput="window.recordSearch=this.value;records()"></div><div class="summaryrow"><div class="mini"><span class="small">${t('total')}</span><strong>${money(sum(es))}</strong></div><div class="mini"><span class="small">${t('entries')}</span><strong>${es.length}</strong></div></div>${es.length?Object.entries(groups).map(([date,arr])=>`<div class="section-title">${date} · ${money(sum(arr))}</div><div class="tablewrap"><table><thead><tr><th>${t('account')}</th><th>${t('motor')}</th><th>${t('quantity')}</th><th>${t('rate')}</th><th>${t('amount')}</th></tr></thead><tbody>${arr.map(e=>`<tr><td>${esc(e.accountName)}</td><td>${esc(e.type)}</td><td>${e.qty}</td><td>${money(e.rate)}</td><td>${money(e.qty*e.rate)}</td></tr>`).join('')}</tbody></table></div>`).join(''):`<div class="empty">${t('noData')}</div>`}`}
function reports(){let es=allEntries(),from=window.rfrom||`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`,to=window.rto||iso(today),aid=window.raid||'all';es=es.filter(e=>e.date>=from&&e.date<=to&&(aid==='all'||e.accountId===aid));let motor={};es.forEach(e=>{let k=e.accountName+' · '+e.type;(motor[k]??={qty:0,total:0}).qty+=Number(e.qty);motor[k].total+=e.qty*e.rate});$('#view').innerHTML=`<div class="section-title">${t('reports')}</div><div class="card"><div class="reportfilters"><div><label class="small">${t('from')}</label><input type="date" value="${from}" onchange="window.rfrom=this.value;reports()"></div><div><label class="small">${t('to')}</label><input type="date" value="${to}" onchange="window.rto=this.value;reports()"></div><div style="grid-column:1/-1"><label class="small">${t('account')}</label><select onchange="window.raid=this.value;reports()"><option value="all" ${aid==='all'?'selected':''}>${t('allAccounts')}</option><option value="pintu" ${aid==='pintu'?'selected':''}>${t('pintu')}</option><option value="jay" ${aid==='jay'?'selected':''}>${t('jay')}</option></select></div></div><div class="totalbox"><span><b>${t('rangeTotal')}</b><div class="small">${es.length} ${t('entries')}</div></span><strong>${money(sum(es))}</strong></div></div><div class="section-title">${t('motorWise')}</div>${Object.keys(motor).length?`<div class="tablewrap"><table><thead><tr><th>${t('motor')}</th><th>${t('units')}</th><th>${t('total')}</th></tr></thead><tbody>${Object.entries(motor).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.qty}</td><td>${money(v.total)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('noData')}</div>`}<div class="btnrow" style="margin-top:15px"><button class="btn" onclick="downloadCSV()">${t('downloadCSV')}</button><button class="btn secondary" onclick="window.print()">${t('printPDF')}</button></div>`}
function downloadCSV(){let from=window.rfrom||'0000-01-01',to=window.rto||'9999-12-31',aid=window.raid||'all';let es=allEntries().filter(e=>e.date>=from&&e.date<=to&&(aid==='all'||e.accountId===aid));let rows=[['Account','Date','Motor Type','Quantity','Rate','Amount','Note'],...es.map(e=>[e.accountName,e.date,e.type,e.qty,e.rate,e.qty*e.rate,e.note||''])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob('\ufeff'+csv,'motor-hisab-report.csv','text/csv;charset=utf-8');}
function downloadBlob(data,name,type){let b=new Blob([data],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function settings(){let id=state.account||'pintu',a=db.accounts[id];$('#view').innerHTML=`<div class="section-title">${t('settings')}</div><div class="field"><label>${t('account')}</label><select onchange="state.account=this.value;settings()"><option value="pintu" ${id==='pintu'?'selected':''}>${t('pintu')}</option><option value="jay" ${id==='jay'?'selected':''}>${t('jay')}</option></select></div><div class="card"><div class="entrytop"><b>${t('motorSettings')} · ${esc(a.name)}</b><span class="tag">${a.types.length}</span></div>${a.types.map((x,i)=>`<div class="settingrow"><span>${esc(x)}</span><button class="iconbtn" onclick="removeType('${id}',${i})">${t('delete')}</button></div>`).join('')}<button class="btn full" style="margin-top:13px" onclick="addType('${id}')">＋ ${t('addType')}</button></div><div class="section-title">${t('dataNote').split('.')[0]}</div><div class="card"><p class="small">${t('dataNote')}</p><div class="btnrow"><button class="btn" onclick="backup()">${t('backup')}</button><button class="btn secondary" onclick="document.getElementById('restoreFile').click()">${t('restore')}</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(this.files[0])"></div></div><div class="footnote">Motor Hisab Book · v1.0 · No sample transactions are included.</div>`}
function addType(id){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h3>${t('addType')}</h3><div class="field"><label>${t('typeName')}</label><input id="newtype" placeholder="e.g. 10 HP TP"></div><div class="btnrow"><button class="btn" onclick="saveType('${id}')">${t('saveType')}</button><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button></div></div></div>`}
function saveType(id){let v=$('#newtype').value.trim();if(!v)return;if(db.accounts[id].types.some(x=>x.toLowerCase()===v.toLowerCase())){toast(t('typeExists'));return}db.accounts[id].types.push(v);db.accounts[id].types.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));persist();closeModal();settings()}
function removeType(id,i){let v=db.accounts[id].types[i];if(db.accounts[id].entries.some(e=>e.type===v)){alert('This motor type is used in saved entries. It cannot be removed.');return}if(confirm(t('delete')+' '+v+'?')){db.accounts[id].types.splice(i,1);persist();settings()}}
function backup(){downloadBlob(JSON.stringify(db,null,2),'motor-hisab-backup.json','application/json');toast(t('backupDone'))}
function restoreBackup(file){if(!file)return;if(!confirm(t('restoreAsk')))return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.accounts||!x.accounts.pintu||!x.accounts.jay)throw Error();db=x;persist();settings();toast(t('restoreDone'))}catch(e){alert('Invalid backup file')}};r.readAsText(file)}
$('#language').addEventListener('change',e=>{state.lang=e.target.value;document.documentElement.lang=state.lang;render();$$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i))});
$$('.nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
render();$$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
